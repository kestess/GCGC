[package]
name = "gcgc-core"
description = "GC log parsing and analysis core for GCGC (port of the Python notebook tool)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
fancy-regex = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
